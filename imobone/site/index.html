<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>imobone</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="imobone">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F2847">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --ink:#152033; --muted:#5A6577; --line:#D5DBE4; --soft:#F4F6F9;
  --brand:#1B3F73; --brand-2:#E4EBF5; --brand-ink:#FFFFFF; --gold:#E0A43A; --gold-ink:#B37A14;
  --side:#0F2847; --side-ink:#DDE6F2; --side-muted:#8EA3C0; --side-active:#1B3F73;
  --pos:#28764A; --neg:#B0392A; --warn:#A5650E; --info:#2E5E8C;
  --pos-bg:#E2F1E7; --neg-bg:#F8E4E0; --warn-bg:#F7ECD9; --info-bg:#E2EBF4; --mut-bg:#ECEEEC;
  --r:10px; --rs:6px;
  --font:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1320; --panel:#131C2B; --ink:#E3E9F2; --muted:#93A0B4; --line:#243149; --soft:#18233A;
    --brand:#86A9E6; --brand-2:#1C2B45; --brand-ink:#0C1320; --gold:#E7B458; --gold-ink:#E7B458;
    --side:#08101C; --side-ink:#D8E1EE; --side-muted:#7F8EA6; --side-active:#16243D;
    --pos:#6CC792; --neg:#EE8676; --warn:#E3AE57; --info:#86B3DE;
    --pos-bg:#18302A; --neg-bg:#3A1F1B; --warn-bg:#352A17; --info-bg:#1B2A38; --mut-bg:#222D29;
  }
}
:root[data-theme="dark"]{
    --bg:#0C1320; --panel:#131C2B; --ink:#E3E9F2; --muted:#93A0B4; --line:#243149; --soft:#18233A;
    --brand:#86A9E6; --brand-2:#1C2B45; --brand-ink:#0C1320; --gold:#E7B458; --gold-ink:#E7B458;
    --side:#08101C; --side-ink:#D8E1EE; --side-muted:#7F8EA6; --side-active:#16243D;
    --pos:#6CC792; --neg:#EE8676; --warn:#E3AE57; --info:#86B3DE;
    --pos-bg:#18302A; --neg-bg:#3A1F1B; --warn-bg:#352A17; --info-bg:#1B2A38; --mut-bg:#222D29;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}
.logo{display:inline-flex;align-items:center;gap:7px;line-height:1}.logo-ic{display:inline-block;width:.98em;height:.53em;vertical-align:baseline;margin-right:.1em;overflow:visible}.logo-ic path{stroke-width:3.4!important}.logo-ic path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:3.6}.logo-ic .roof{stroke:var(--gold)}.logo-ic .door{stroke:currentColor}
.login-box .logo-ic .roof{stroke:var(--gold-ink)}.login-box .logo{color:var(--brand)}
.keep{display:flex;gap:8px;align-items:center;font-size:14px;margin:-4px 0 14px;cursor:pointer}.keep input{width:18px;height:18px;accent-color:var(--brand)}
.wm{font-weight:700;letter-spacing:-.02em;font-size:18px;text-transform:lowercase}.wm-a{color:inherit;font-weight:600}.wm-b{color:var(--gold);font-weight:800}
.qacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;max-width:560px}.qacts .btn{justify-content:center;white-space:normal;text-align:center;line-height:1.2;padding:10px 6px;min-height:46px}
.logo.lg .wm{font-size:32px}.logo.lg{gap:10px;margin-bottom:10px}
.login-box .logo .wm-a{color:var(--brand)}.login-box .logo .wm-b{color:var(--gold-ink)}
.brand .logo{margin-bottom:8px}.topbar .logo .wm{font-size:17px}
.brand .emp{display:block;font-size:13px;font-weight:600;color:var(--side-ink);opacity:.85}
.brand span{font-size:12.5px;color:var(--side-muted)}
.nav-group{font-size:12px;color:var(--side-muted);padding:14px 10px 4px;font-weight:600}
.nav a{display:block;padding:8px 10px;border-radius:var(--rs);color:var(--side-ink);text-decoration:none;font-weight:500;font-size:14.5px}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.on{background:var(--side-active);font-weight:700;box-shadow:inset 3px 0 0 var(--gold)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.side-foot .who{font-weight:700}
.side-foot .role{color:var(--side-muted);font-size:12.5px}
.side-foot button{background:none;border:0;color:var(--side-muted);padding:4px 0;cursor:pointer;text-decoration:underline;margin-right:12px;font-size:13px}
.localnote{margin-top:10px;font-size:12px;color:var(--side-muted);line-height:1.4}
.main{padding:28px clamp(16px,3.2vw,40px) 60px;min-width:0;max-width:1320px}
.topbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--side);color:var(--side-ink);padding:10px 14px}
  .topbar b{font-weight:800}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.2);color:inherit;border-radius:var(--rs);padding:5px 10px;cursor:pointer}
  .main{padding-top:20px}
}
@media (prefers-reduced-motion: reduce){.side{transition:none}}

/* headings */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:22px}
.ph h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.ph .sub{color:var(--muted);margin-top:2px;font-size:14px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
.crumb a{color:var(--muted)}
h2{font-size:17px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:var(--rs);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ok{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 40%,var(--line))}
.btn.danger{color:var(--neg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* hero */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:1.25fr 1fr;overflow:hidden}
.hero-l{padding:26px 28px;border-right:1px solid var(--line)}
.hero-l .lbl{font-size:14px;color:var(--muted);font-weight:600}
.hero-l .big{font-size:clamp(34px,5vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:6px 0 10px}
.hero-l p{margin:0;color:var(--muted);font-size:13.5px;max-width:46ch}
.hero-r{padding:20px 28px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.eq{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:15px}
.eq span{color:var(--muted)}
.eq b{font-size:18px;font-weight:700}
.eq.tot{border-top:2px solid var(--ink);padding-top:10px;margin-top:2px}
.eq.tot b{font-size:22px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-l{border-right:0;border-bottom:1px solid var(--line)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .l{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .h{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat.warn .v{color:var(--warn)} .stat.neg .v{color:var(--neg)} .stat.pos .v{color:var(--pos)}
.stat.sep{background:var(--soft);border-style:dashed}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}

/* tables */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:800;background:var(--soft);border-top:2px solid var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
td .acts{flex-wrap:nowrap;justify-content:flex-end}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:12px}

.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-aberto{background:var(--info-bg);color:var(--info)}
.b-recebido,.b-pago,.b-ativo,.b-alugada,.b-ativa{background:var(--pos-bg);color:var(--pos)}
.b-vencido{background:var(--neg-bg);color:var(--neg)}
.b-cancelado,.b-inativo,.b-devolvida,.b-encerrado{background:var(--mut-bg);color:var(--muted)}
.b-vaga,.b-parcial{background:var(--warn-bg);color:var(--warn)}
.b-integral{background:var(--neg-bg);color:var(--neg)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:12.5px;color:var(--muted);font-weight:600}
input,select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:var(--rs);padding:8px 10px;font-size:14.5px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 50%,transparent);border-color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brand-2);color:var(--ink)}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* forms / modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 14px 24px;overflow-y:auto}
.modal{background:var(--panel);border-radius:12px;width:100%;max-width:640px;border:1px solid var(--line);margin:auto 0}
.modal header{padding:18px 22px 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal header h3{margin:0;font-size:18px;font-weight:800}
.modal .body{padding:10px 22px 4px}
.modal footer{padding:16px 22px 20px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.grid .f{grid-column:span 6}
.grid .c2{grid-column:span 2}.grid .c3{grid-column:span 3}.grid .c4{grid-column:span 4}
@media (max-width:560px){.grid .c2,.grid .c3,.grid .c4{grid-column:span 6}}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin:14px 0 4px}
legend{font-weight:700;font-size:14px;padding:0 6px}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--neg);font-size:13.5px;margin-top:8px;min-height:1em}
.hide{display:none!important}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:400px}
.login-box .mark{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:6px}
.login-box .tag{color:var(--muted);margin-bottom:24px}
.login-box .card{padding:24px}
.login-box .f{margin-bottom:14px}
.login-box .btn.pri{width:100%;justify-content:center;padding:10px}
.linkbtn{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-weight:600;font-size:13.5px;text-decoration:underline}

/* info blocks */
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 24px;padding:18px 20px}
.info div{padding:4px 0}
.info .k{font-size:12.5px;color:var(--muted);font-weight:600}
.info .val{font-weight:600}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand-2);color:var(--brand);font-weight:800;display:grid;place-items:center;font-size:13px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:90;max-width:90vw}
.hist{font-size:12.5px;color:var(--muted);margin-top:2px}
.back{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--brand);color:var(--brand);font-weight:700;font-size:15px;padding:7px 14px;border-radius:var(--rs);margin:0 0 14px;cursor:pointer}
.bnav .bn-back{color:var(--brand)!important;font-weight:800}
.ck{width:34px}.ck input{width:20px;height:20px;accent-color:var(--brand)}
tr.selrow td{background:var(--brand-2)!important}
.selbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);margin-bottom:12px}
.selbar.on{border-color:var(--brand);background:var(--brand-2);position:sticky;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:5}
.selall{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}.selall input{width:20px;height:20px;accent-color:var(--brand)}
@media (max-width:860px){.selbar.on{top:calc(58px + env(safe-area-inset-top,0px))}}
.bnav{display:none}
.wm-o{position:relative;display:inline-block}
.roof-o{position:absolute;left:50%;transform:translateX(-50%);top:-.05em;width:.86em;height:.47em;overflow:visible}
.roof-o path{fill:none;stroke:var(--gold);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.login-box .roof-o path{stroke:var(--gold-ink)}
.wm{line-height:1}
.lsel{width:100%;margin:0 0 14px;font-weight:600}
.fbar{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.fbar-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 16px 8px 13px;font-weight:700;font-size:14px;cursor:pointer;color:var(--brand)}
.fbar-btn:hover{border-color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.chip{background:var(--brand-2);color:var(--ink);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.filters.in-modal{flex-direction:column;align-items:stretch;margin:0}.filters.in-modal .f,.filters.in-modal select,.filters.in-modal input{width:100%}
.filters.in-modal .period{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters.in-modal .period select:first-child{grid-column:1/-1}
.filters.in-modal .fbtns{margin-top:6px}.filters.in-modal .fbtns label{display:none}.filters.in-modal .fbtns .acts .btn{flex:1;justify-content:center;padding:11px}
.gseg{margin:0 0 12px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.gseg button{padding:8px 4px}
html,body{overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.grid{grid-template-columns:repeat(6,minmax(0,1fr))}
.grid input,.grid select,.grid textarea,.f>input,.f>select{width:100%}
input[type=date],input[type=month]{min-width:0;display:block;-webkit-appearance:none;appearance:none;min-height:40px}
@media (max-width:860px),(pointer:coarse){input,select,textarea{font-size:16px}}
.modal{max-width:min(640px,100%)}.modal .body{overflow-wrap:anywhere}
.rsel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}.rsel select{width:100%}
.fbtns .acts{flex-wrap:nowrap}
.fnote{color:var(--warn);font-weight:600;min-height:0}
.btn.pulse{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent)}
@media (max-width:560px){.fbtns{width:100%}.fbtns .acts .btn{flex:1;justify-content:center;padding:10px}}
.chart-card{padding:16px 18px}
.chart-wrap{overflow-x:auto;margin:0 -4px}
.dash2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
@media (max-width:900px){.dash2{grid-template-columns:1fr}}
.hb{display:grid;gap:14px}
.hb-row{display:grid;gap:4px;border-radius:6px}
.hb-row.click{cursor:pointer;padding:6px;margin:-6px}.hb-row.click:hover{background:var(--soft)}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hb-l{font-weight:600;min-width:0;overflow-wrap:anywhere}
.hb-top b{white-space:nowrap}
.hb-bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.hb-bar i{display:block;height:100%;border-radius:4px;min-width:2px}
.hb-sub{display:flex;justify-content:space-between;gap:10px}
.topbar .tb-back{font-weight:700}

.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;margin:4px 0 16px}
.kv .k{font-size:12.5px;color:var(--muted);font-weight:600}.kv .val{font-weight:600;overflow-wrap:anywhere}
.modal .acts .btn{padding:9px 14px}
@media (max-width:860px){
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--panel);border-top:1px solid var(--line);padding:0 14px env(safe-area-inset-bottom,0px)}
  .bnav a,.bnav button{background:none;border:0;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700;padding:11px 2px 12px;text-align:center;cursor:pointer}
  .bnav .on{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
  .main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:700px){
  .tw{overflow:visible;background:none;border:0;border-radius:0}
  .tw table,.tw tbody,.tw tfoot,.tw tr,.tw td{display:block;width:100%}
  .tw thead{display:none}
  .tw tr{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;padding:8px 14px}
  .tw td{border:0!important;padding:5px 0;display:flex;justify-content:space-between;align-items:baseline;gap:14px;text-align:right;background:none!important}
  .tw td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;font-weight:600;text-align:left;flex:none}
  .tw td[data-l=""]::before{display:none}
  .tw td[data-l=""]{justify-content:flex-start}
  .tw td:empty{display:none}
  .tw td .acts{justify-content:flex-start;flex-wrap:wrap;padding-top:4px}
  .tw tfoot tr{background:var(--soft)}
  .tw .empty{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
  .tdv{min-width:0;overflow-wrap:anywhere}
  .kv{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="root"><div class="login"><div class="muted">Carregando…</div></div></div>
<script>
"use strict";
/* ================= util ================= */
const $=(s,r=document)=>r.querySelector(s);
const LOGO_ICON=(sz=30)=>`<svg class="logo-ic" width="${sz}" height="${Math.round(sz*.56)}" viewBox="0 0 36 20" aria-hidden="true"><path class="roof" d="M4 16 18 4l14 12"/></svg>`;
const LOGO=(cls='')=>`<span class="logo ${cls}" aria-label="imobone"><span class="wm"><span class="wm-a">imob</span><span class="wm-b">one</span></span></span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje=()=>iso(new Date());
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=s=>s?s.slice(0,10).split('-').reverse().join('/'):'—';
const fdt=s=>{if(!s)return'—';const d=new Date(s);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
const fcomp=s=>s?s.slice(5,7)+'/'+s.slice(0,4):'—';
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sum=(a,f)=>a.reduce((t,x)=>t+(Number(f(x))||0),0);
const num=v=>Math.round((parseFloat(String(v).replace(',','.'))||0)*100)/100;
const cmp=(a,b)=>String(a||'').localeCompare(String(b||''),'pt-BR',{numeric:true});
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
async function hash(salt,pwd){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pwd));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ================= dados ================= */
const COLS=['usuarios','predios','unidades','contratos','receitas','despesas','config'];
const S={usuarios:[],predios:[],unidades:[],contratos:[],receitas:[],despesas:[],config:[]};
const SB={get url(){return((window.IMOB_CFG||{}).supabaseUrl||'').replace(/\/$/,'')},get key(){return(window.IMOB_CFG||{}).supabaseKey||''},
  h(x){const o={apikey:this.key,'Content-Type':'application/json',...(x||{})};if(this.key.startsWith('eyJ'))o.Authorization='Bearer '+this.key;return o},
  async all(){const rows=[];for(let off=0;;off+=1000){const r=await fetch(`${this.url}/rest/v1/docs?select=col,id,data&order=col,id&limit=1000&offset=${off}`,{headers:this.h()});if(!r.ok)throw new Error('Supabase '+r.status+': '+await r.text());const a=await r.json();rows.push(...a);if(a.length<1000)break}return rows},
  async put(col,id,data){const r=await fetch(`${this.url}/rest/v1/docs`,{method:'POST',headers:this.h({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify([{col,id,data,updated_at:new Date().toISOString()}])});if(!r.ok)throw new Error('Supabase '+r.status)},
  async del(col,id){const r=await fetch(`${this.url}/rest/v1/docs?col=eq.${encodeURIComponent(col)}&id=eq.${encodeURIComponent(id)}`,{method:'DELETE',headers:this.h()});if(!r.ok)throw new Error('Supabase '+r.status)}
};
async function sbLoad(){const rows=await SB.all();const n={};COLS.forEach(c=>n[c]=[]);rows.forEach(r=>{if(n[r.col])n[r.col].push({...r.data,id:r.id})});COLS.forEach(c=>S[c]=n[c])}
const Store={mode:'local',db:null,
  async init(){
    if(SB.url&&SB.key){this.mode='supa';
      try{await sbLoad()}catch(e){console.error(e);document.getElementById('root').innerHTML='<div class="login"><div class="login-box card" style="padding:22px"><b>Não foi possível conectar ao banco de dados.</b><p class="hint">Confira o endereço e a chave no arquivo config.js e se a tabela foi criada no Supabase.</p><p class="hint">'+esc(e.message)+'</p></div></div>';throw e}
      const refresh=async()=>{if(document.visibilityState!=='visible'||modalOpen())return;try{await sbLoad();scheduleRender()}catch(e){}};
      setInterval(refresh,60000);document.addEventListener('visibilitychange',refresh);return}
    let db=null;
    try{ if(window.claude&&typeof window.claude.use==='function'){
      db=await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),9000))]);
    }}catch(e){db=null}
    if(db){
      this.mode='db';this.db=db;
      await new Promise(res=>{
        const got=new Set();let done=false;
        const finish=()=>{if(!done){done=true;res()}};
        setTimeout(finish,10000);
        COLS.forEach(c=>{
          db.collection(c).onSnapshot(snap=>{
            S[c]=snap.docs.map(d=>({...d.data(),id:d.id}));
            got.add(c); if(got.size===COLS.length)finish();
            if(done)scheduleRender();
          },()=>{got.add(c);if(got.size===COLS.length)finish()});
        });
      });
    }else{
      this.mode='local';
      try{const d=JSON.parse(ls.get('gi_dados')||'{}');COLS.forEach(c=>{if(Array.isArray(d[c]))S[c]=d[c]})}catch(e){}
    }
  },
  persist(){if(this.mode==='local'){const o={};COLS.forEach(c=>o[c]=S[c]);ls.set('gi_dados',JSON.stringify(o))}},
  async save(col,obj){
    if(!obj.id)obj.id=uid();
    const i=S[col].findIndex(x=>x.id===obj.id);
    if(i>=0)S[col][i]=obj;else S[col].push(obj);
    if(this.mode==='db'){
      const {id,...data}=obj;
      try{await this.db.collection(col).doc(id).set(JSON.parse(JSON.stringify(data)))}
      catch(e){toast('Não foi possível salvar: '+(e&&e.message||'sem permissão'));throw e}
    }else if(this.mode==='supa'){const {id,...data}=obj;try{await SB.put(col,id,JSON.parse(JSON.stringify(data)))}catch(e){toast('Não foi possível salvar. Verifique a internet.');throw e}}
    else this.persist();
    return obj;
  },
  async remove(col,id){
    S[col]=S[col].filter(x=>x.id!==id);
    if(this.mode==='db'){try{await this.db.collection(col).doc(id).delete()}catch(e){toast('Não foi possível excluir.');throw e}}
    else if(this.mode==='supa'){try{await SB.del(col,id)}catch(e){toast('Não foi possível excluir.');throw e}}
    else this.persist();
  }
};
const get=(col,id)=>S[col].find(x=>x.id===id);
const empresa=()=>get('config','empresa')||{};

/* ================= sessão ================= */
let ME=null;
const isAdmin=()=>ME&&ME.perfil==='admin';
const stamp=()=>({ts:new Date().toISOString(),u:ME?.id,un:ME?.nome});
const hist=(obj,a,d)=>{obj.historico=[...(obj.historico||[]),{...stamp(),a,d:d||''}];return obj};
const Prefs={v:{},doc:null,
  async init(){if(Store.mode!=='db')return;try{const u=await Promise.race([window.claude.use('user'),new Promise(r=>setTimeout(()=>r(null),6000))]);if(!u)return;this.doc=Store.db.doc('data/users/me/prefs');const sn=await this.doc.get();if(sn.exists)this.v=sn.data()||{}}catch(e){this.doc=null}},
  get(k){const v=this.v[k];return v!=null&&v!==''?v:ls.get('gi_'+k)},
  async set(o){Object.assign(this.v,o);Object.entries(o).forEach(([k,v])=>v==null?ls.del('gi_'+k):ls.set('gi_'+k,String(v)));if(this.doc){try{await this.doc.set(JSON.parse(JSON.stringify(this.v)))}catch(e){}}}
};
function restoreSession(){if(Prefs.get('sessv')!=='2')return;const id=Prefs.get('sess');const exp=+Prefs.get('exp')||0;if(!id||(exp&&Date.now()>exp))return;const u=get('usuarios',id);if(u&&u.status==='ativo')ME=u}

/* ================= regras ================= */
const vr=r=>Number(r.valorRecebido??r.valor)||0;
function stR(r){if(r.status==='recebido')return'recebido';if(r.status==='cancelado')return'cancelado';return(r.vencimento||'')<hoje()?'vencido':'aberto'}
function stD(d){if(d.status==='pago')return'pago';if(d.status==='cancelado')return'cancelado';return(d.data||'')<hoje()?'vencido':'aberto'}
const ST_LBL={aberto:'Em aberto',vencido:'Vencido',recebido:'Recebido',pago:'Pago',cancelado:'Cancelado'};
const badge=(s,l)=>`<span class="badge b-${s}">${esc(l||ST_LBL[s]||s)}</span>`;
const CST={'Ativa':'ativa','Devolvida':'devolvida','Utilizada parcialmente':'parcial','Utilizada integralmente':'integral'};
const scope=s=>x=>(!s.predioId||x.predioId===s.predioId)&&(!s.unidadeId||x.unidadeId===s.unidadeId);
function totais(s={},per){
  const m=scope(s);
  const rec=S.receitas.filter(r=>m(r)&&r.status==='recebido'&&(!per||inP(r.dataRecebimento,per)));
  const des=S.despesas.filter(d=>m(d)&&d.status==='pago'&&(!per||inP(d.dataPagamento,per)));
  const R=sum(rec,vr),D=sum(des,d=>d.valor);return{R,D,res:R-D};
}
const saldo=(s={})=>totais(s).res;
const contratoAtivo=uId=>S.contratos.find(c=>c.unidadeId===uId&&c.ativo);
const caucoes=()=>S.contratos.filter(c=>c.caucao&&c.caucao.possui);
const caucaoAtiva=c=>c.caucao&&c.caucao.possui&&c.caucao.status==='Ativa';
const totalCaucoes=(s={})=>sum(S.contratos.filter(c=>caucaoAtiva(c)&&scope(s)(c)),c=>c.caucao.valor);
const nomePredio=id=>get('predios',id)?.nome||'—';
const nomeUnid=id=>id?(get('unidades',id)?.nome||'—'):'—';

/* ================= período ================= */
const MESF=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let P={preset:'mesano',mes:pad(new Date().getMonth()+1),ano:String(new Date().getFullYear()),de:'',ate:''};
const PRESETS=[['mesano','Mês e ano'],['mes','Este mês'],['mesant','Mês anterior'],['ano','Este ano'],['anoant','Ano anterior'],['tudo','Tudo'],['custom','Personalizado']];
function periodo(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  switch(P.preset){
    case'mesano':{const ay=+P.ano||y;if(!P.mes)return[ay+'-01-01',ay+'-12-31'];const mm=+P.mes;return[iso(new Date(ay,mm-1,1)),iso(new Date(ay,mm,0))]}
    case'mes':return[iso(new Date(y,m,1)),iso(new Date(y,m+1,0))];
    case'mesant':return[iso(new Date(y,m-1,1)),iso(new Date(y,m,0))];
    case'ano':return[y+'-01-01',y+'-12-31'];
    case'anoant':return[(y-1)+'-01-01',(y-1)+'-12-31'];
    case'custom':return[P.de||'1900-01-01',P.ate||'2999-12-31'];
    default:return['1900-01-01','2999-12-31'];
  }
}
const inP=(s,[a,b])=>!!s&&s.slice(0,10)>=a&&s.slice(0,10)<=b;
function perLabel(){const[a,b]=periodo();if(P.preset==='mesano')return P.mes?`${MESF[+P.mes-1]} de ${P.ano}`:`ano de ${P.ano}`;if(P.preset==='tudo')return'todo o período';if(P.preset==='custom')return`${P.de?fd(a):'início'} a ${P.ate?fd(b):'hoje'}`;return PRESETS.find(p=>p[0]===P.preset)[1].toLowerCase()+` (${fd(a)} a ${fd(b)})`}
function perCurto(){if(P.preset==='mesano')return P.mes?`${MESES[+P.mes-1]}/${P.ano}`:P.ano;if(P.preset==='tudo')return'todo o período';return'o período'}
function anos(){const ys=new Set([String(new Date().getFullYear()),P.ano]);[...S.receitas.map(r=>r.vencimento),...S.despesas.map(d=>d.data)].forEach(d=>{if(d)ys.add(d.slice(0,4))});return[...ys].filter(Boolean).sort().reverse()}
function periodUI(){
  return `<div class="period"><select data-ch="preset" aria-label="Período">${PRESETS.map(([k,l])=>`<option value="${k}" ${P.preset===k?'selected':''}>${l}</option>`).join('')}</select>
  ${P.preset==='mesano'?`<select data-ch="pmes" aria-label="Mês"><option value="">Ano inteiro</option>${MESF.map((n,i)=>`<option value="${pad(i+1)}" ${P.mes===pad(i+1)?'selected':''}>${n[0].toUpperCase()+n.slice(1)}</option>`).join('')}</select><select data-ch="pano" aria-label="Ano">${anos().map(a=>`<option ${P.ano===a?'selected':''}>${a}</option>`).join('')}</select>`:''}
  ${P.preset==='custom'?`<input type="date" data-ch="pde" value="${esc(P.de)}" aria-label="De"><span class="muted">a</span><input type="date" data-ch="pate" value="${esc(P.ate)}" aria-label="Até">`:''}</div>`;
}

/* ================= router/render ================= */
let pendingRender=false;
const modalOpen=()=>!!$('.modal-bg');
function typing(){const a=document.activeElement;return a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.type!=='checkbox'}
function scheduleRender(){if(modalOpen()||typing()){pendingRender=true;return}render()}
document.addEventListener('focusout',()=>{if(pendingRender&&!modalOpen())setTimeout(()=>{if(pendingRender&&!typing()){pendingRender=false;render()}},50)});
let NAV=[],prevHash=location.hash||'#/dashboard',goingBack=false;
window.addEventListener('hashchange',()=>{
  if(goingBack)goingBack=false;else if(prevHash!==location.hash){NAV.push(prevHash);if(NAV.length>50)NAV.shift()}
  prevHash=location.hash;closeModal(true);closeSide();render();window.scrollTo(0,0)});
function parentOf(r){if(r.name==='unidade'){const u=get('unidades',r.id);return u?'#/predio/'+u.predioId:'#/unidades'}if(r.name==='predio')return'#/predios';return'#/dashboard'}
function voltar(){if(NAV.length){goingBack=true;location.hash=NAV.pop()}else{goingBack=true;location.hash=parentOf(route())}}
function labelTables(root){
  (root||document).querySelectorAll('.tw table').forEach(t=>{
    const hs=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr=>{let i=0;[...tr.children].forEach(td=>{if(!td.hasAttribute('data-l')){td.setAttribute('data-l',hs[i]||'');if(td.innerHTML.trim()&&!td.querySelector(':scope>.tdv'))td.innerHTML='<div class="tdv">'+td.innerHTML+'</div>'}i+=td.colSpan||1})});
    t.querySelectorAll('tfoot tr').forEach(tr=>{let i=0;[...tr.children].forEach(td=>{if(!td.hasAttribute('data-l'))td.setAttribute('data-l',(td.colSpan||1)>1?'':(hs[i]||''));i+=td.colSpan||1})});
  });
}

const ROUTES={
  dashboard:pgDashboard,predios:pgPredios,predio:pgPredio,unidades:pgUnidades,unidade:pgUnidade,
  receitas:pgReceitas,despesas:pgDespesas,'rel-receitas':pgRelReceitas,'rel-despesas':pgRelDespesas,
  'rel-rxd':pgRxD,'rel-caucoes':pgRelCaucoes,usuarios:pgUsuarios,empresa:pgEmpresa
};
function route(){const h=(location.hash||'#/dashboard').slice(2).split('/');return{name:h[0]||'dashboard',id:h[1]}}
function render(){
  pendingRender=false;
  const root=$('#root');
  if(ME){const fresh=get('usuarios',ME.id);if(!fresh||fresh.status!=='ativo'){ME=null;Prefs.set({sess:null,exp:null})}else ME=fresh}
  if(!ME){root.innerHTML=S.usuarios.length?loginHTML():setupHTML();return}
  const r=route();const fn=ROUTES[r.name]||pgDashboard;
  if(!$('.app',root))root.innerHTML=shellHTML();
  $('.side',root).outerHTML=sideHTML(r.name);
  let html;try{html=fn(r.id)}catch(e){console.error(e);html=`<div class="empty"><b>Algo deu errado ao abrir esta tela.</b>${esc(e.message)}</div>`}
  const back=r.name!=='dashboard'?'<button class="back" data-act="voltar">‹ Voltar</button>':'';
  $('.main',root).innerHTML=back+html;labelTables($('.main',root));addFilterButtons($('.main',root));compactFilters($('.main',root));
  $('.topbar',root).outerHTML=topbarHTML(r.name);
  const bn=$('.bnav',root);if(bn)bn.outerHTML=bnavHTML(r.name);
  const t=empresa().nome;document.title=(t?t+' · ':'')+'imobone';
}
function topbarHTML(cur){return`<div class="topbar">${cur!=='dashboard'?'<button data-act="voltar" class="tb-back">‹ Voltar</button>':''}${LOGO()}<button data-act="menu" aria-label="Abrir menu" style="margin-left:auto">Menu</button></div>`}
function shellHTML(){return`<div class="topbar"></div><div class="app"><aside class="side"></aside><main class="main"></main></div><nav class="bnav"></nav>`}
function bnavHTML(cur){const A=(k,l,al=[])=>`<a href="#/${k}" class="${k===cur||al.includes(cur)?'on':''}">${l}</a>`;return`<nav class="bnav" aria-label="Navegação">${cur!=='dashboard'?'<button data-act="voltar" class="bn-back">‹ Voltar</button>':''}${A('dashboard','Dashboard')}${cur==='dashboard'?A('predios','Prédios',['predio','unidades','unidade']):''}${A('receitas','Receitas')}${A('despesas','Despesas')}<button data-act="menu">Mais</button></nav>`}
function sideHTML(cur){
  const L=(k,l,also=[])=>`<a href="#/${k}" class="${k===cur||also.includes(cur)?'on':''}">${l}</a>`;
  return`<aside class="side ${sideOpen?'open':''}">
  <div class="brand">${LOGO()}${empresa().nome?`<span class="emp">${esc(empresa().nome)}</span>`:''}<span>Prédios, aluguéis e caixa</span></div>
  <nav class="nav">
    ${L('dashboard','Dashboard')}
    <div class="nav-group">Prédios</div>${L('predios','Prédios',['predio'])}${L('unidades','Unidades',['unidade'])}
    <div class="nav-group">Financeiro</div>${L('receitas','Receitas')}${L('despesas','Despesas')}
    <div class="nav-group">Relatórios</div>${L('rel-receitas','Receitas')}${L('rel-despesas','Despesas')}${L('rel-rxd','Receitas x Despesas')}${L('rel-caucoes','Cauções')}
    <div class="nav-group">Configurações</div>${isAdmin()?L('usuarios','Usuários'):''}${L('empresa','Dados da empresa')}
  </nav>
  <div class="side-foot"><div class="who">${esc(ME.nome)}</div><div class="role">${isAdmin()?'Administrador':'Usuário'}</div>
  <div style="margin-top:6px"><button data-act="minhaSenha">Alterar senha</button><button data-act="sair">Sair</button></div>
  ${Store.mode==='local'?'<div class="localnote">Modo local: os dados ficam salvos somente neste navegador.</div>':''}</div>
  </aside>`;
}
let sideOpen=false;
function closeSide(){if(sideOpen){sideOpen=false;$('.side')?.classList.remove('open');$('.scrim')?.remove()}}

/* ================= login ================= */
function loginHTML(){return`<div class="login"><div class="login-box">
  ${LOGO('lg')}<div class="tag">${empresa().nome?esc(empresa().nome)+' · ':''}Gestão de prédios, aluguéis e caixa.</div>
  <form class="card" data-form="login">
   <div class="f"><label for="lu">E-mail ou usuário</label><input id="lu" name="u" autocomplete="username" required value="${esc(Prefs.get('last')||'')}"></div>
   <div class="f"><label for="lp">Senha</label><input id="lp" name="p" type="password" autocomplete="current-password" required ${Prefs.get('last')?'autofocus':''}></div>
   <label class="keep"><input type="checkbox" name="manter" value="1"> Manter conectado</label>
   <button class="btn pri" type="submit">Entrar</button>
   <div class="err" id="lerr"></div>
   <button type="button" class="linkbtn" data-act="esqueci">Esqueci minha senha</button>
  </form></div></div>`}
function setupHTML(){return`<div class="login"><div class="login-box">
  ${LOGO('lg')}<div class="mark" style="font-size:22px">Primeiro acesso</div><div class="tag">Crie o administrador do sistema. Ele poderá cadastrar os demais usuários.</div>
  <form class="card" data-form="setup">
   <div class="f"><label>Nome da empresa (opcional)</label><input name="empresa" autocomplete="organization"></div>
   <div class="f"><label>Seu nome</label><input name="nome" required autocomplete="name"></div>
   <div class="f"><label>E-mail</label><input name="email" type="email" required autocomplete="email"></div>

function monthsRange(a,b){const out=[];let[y,m]=a.slice(0,7).split('-').map(Number);const[ye,me]=b.slice(0,7).split('-').map(Number);while((y<ye||(y===ye&&m<=me))&&out.length<60){out.push(`${y}-${pad(m)}`);m++;if(m>12){m=1;y++}}return out}
function chartMonths(){
  const[a,b]=periodo();const cur=hoje().slice(0,7);
  if(P.preset==='tudo'){const ds=[...S.receitas.map(r=>r.dataRecebimento),...S.despesas.map(d=>d.dataPagamento)].filter(Boolean).sort();const first=ds[0]?ds[0].slice(0,7):cur;const ms=monthsRange(first,cur);return ms.length>=2?ms.slice(-36):monthsRange(shiftM(cur,-11),cur)}
  const ms=monthsRange(a,b<'2999'?b:cur+'-01');
  if(ms.length>=2)return ms;
  return monthsRange(shiftM(a.slice(0,7),-11),a.slice(0,7));
}
function shiftM(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return`${y}-${pad(m)}`}
function hbars(items,max){
  if(!items.length)return'<div class="empty" style="padding:18px">Sem movimentação no período.</div>';
  return`<div class="hb">${items.map(it=>`<div class="hb-row ${it.act?'click':''}" ${it.act?`data-act="${it.act}" data-id="${it.id}" role="button" tabindex="0"`:''}>
   <div class="hb-top"><span class="hb-l">${esc(it.label)}${it.sub?` <span class="hint">${esc(it.sub)}</span>`:''}</span><b class="num ${it.saldo<0?'neg':''}">${it.saldo!=null?brl(it.saldo):brl(it.v)}</b></div>
   ${it.r!=null?`<div class="hb-bar"><i style="width:${(it.r/max*100).toFixed(1)}%;background:var(--pos)" title="Receitas ${brl(it.r)}"></i></div><div class="hb-bar"><i style="width:${(it.d/max*100).toFixed(1)}%;background:var(--neg)" title="Despesas ${brl(it.d)}"></i></div><div class="hb-sub hint"><span>Receitas ${brl(it.r)}</span><span>Despesas ${brl(it.d)}</span></div>`
   :`<div class="hb-bar"><i style="width:${(it.v/max*100).toFixed(1)}%;background:${it.color||'var(--neg)'}"></i></div>`}</div>`).join('')}</div>`;

function rowActs(x,kind){
  const r=kind==='r';const st=r?stR(x):stD(x);const b=[];
  if(st==='aberto'||st==='vencido'){
    b.push(`<button class="btn sm ok" data-act="${r?'receber':'pagar'}" data-id="${x.id}">${r?'Receber':'Pagar'}</button>`);
    b.push(`<button class="btn sm" data-act="${r?'editReceita':'editDespesa'}" data-id="${x.id}">Editar</button>`);
    if(isAdmin())b.push(`<button class="btn sm danger" data-act="${r?'cancelarR':'cancelarD'}" data-id="${x.id}">Cancelar</button>`);
  }else if((st==='recebido'||st==='pago')&&isAdmin())b.push(`<button class="btn sm" data-act="${r?'estornarR':'estornarD'}" data-id="${x.id}">Estornar</button>`);
  b.push(`<button class="btn sm ghost" data-act="abrir" data-col="${r?'receitas':'despesas'}" data-id="${x.id}">Detalhes</button>`);
  return`<div class="acts">${b.join('')}</div>`;
}

function chart(g){
  if(!g.some(x=>x.R||x.D))return'<div class="empty" style="padding:22px">Sem recebimentos ou pagamentos nesses meses.</div>';
  const cw=Math.max(280,Math.min(1100,(document.querySelector('.main')?.clientWidth||800)-(innerWidth<700?40:80)));
  const max=Math.max(1,...g.flatMap(x=>[x.R,x.D]))*1.12;const few=g.length<=6;const L=few?8:46,H=230,base=196,top=few?26:14;
  const step=Math.max(cw<500?26:34,(cw-L-6)/Math.max(1,g.length));const W=Math.max(cw,L+g.length*step+6);
  const bw=Math.max(6,Math.min(few?56:22,step*(few?0.34:0.32))),gap=few?6:2;const y=v=>base-(v/max)*(base-top);
  const cmpct=v=>v>=1e6?(v/1e6).toFixed(1).replace('.',',')+' mi':v>=1e3?(v/1e3).toFixed(v>=1e4?0:1).replace('.',',')+' mil':String(Math.round(v));
  const every=step<34?2:1;const T=(x,yy,t,an,c,w)=>`<text x="${x}" y="${yy}" text-anchor="${an}" font-size="11" style="fill:${c};${w?'font-weight:700':''}">${t}</text>`;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de receitas e despesas por mês" style="display:block;width:100%;height:auto;min-width:${Math.min(W,g.length*26+L)}px;font-family:inherit">`;
  if(!few)[0,.5,1].forEach(f=>{const yy=y(max/1.12*f);s+=`<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/>`+T(L-6,yy+4,cmpct(max/1.12*f),'end','var(--muted)')});
  else s+=`<line x1="${L}" x2="${W}" y1="${base}" y2="${base}" style="stroke:var(--line)"/>`;
  g.forEach((x,i)=>{const cx=L+i*step+step/2;
    const bar=(v,xx,c,lbl)=>{const h=Math.max(v?2:0,base-y(v));return`<rect x="${xx}" y="${base-h}" width="${bw}" height="${h}" rx="3" style="fill:${c}"><title>${x.label}: ${lbl} ${brl(v)}</title></rect>`+(few&&v?T(xx+bw/2,base-h-6,cmpct(v),'middle',c,1):'')};
    s+=bar(x.R,cx-bw-gap/2,'var(--pos)','receitas')+bar(x.D,cx+gap/2,'var(--neg)','despesas');
    if(i%every===0)s+=T(cx>W-26?W-2:cx,base+18,x.label,cx>W-26?'end':'middle','var(--muted)')});
  return s+'</svg>';
}

  <p class="hint" style="margin-top:14px">${Store.mode==='supa'?'Os dados ficam salvos no banco de dados online e aparecem em qualquer aparelho.':Store.mode==='db'?'Os dados ficam salvos junto a esta página e são compartilhados com quem tiver acesso a ela.':'Modo local: os dados ficam salvos somente neste navegador. Para uso em equipe, abra a versão publicada.'}</p>`;
}
function empresaForm(){
  const e=empresa();
  openModal({title:'Dados da empresa',body:`<div class="grid">${fld('Nome',inp('nome',e.nome),'c4')}${fld('CPF / CNPJ',inp('doc',e.doc),'c2')}${fld('Telefone',inp('telefone',e.telefone),'c3')}${fld('E-mail',inp('email',e.email,'type="email"'),'c3')}${fld('Endereço',inp('endereco',e.endereco))}</div>`,
   onSubmit:async f=>{await Store.save('config',{...e,...f,id:'empresa'});$('#root').innerHTML='';toast('Dados salvos.')}});
}

let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{const r=route().name;if(ME&&(r==='dashboard'||r==='rel-rxd')&&!modalOpen()&&!typing())render()},250)});
/* ================= boot ================= */
(async()=>{await Store.init();await Prefs.init();restoreSession();render()})();
</script>
</body>
</html>
